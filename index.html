<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Svečiai" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#111827" />
  <title>Svečiai</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #F3F0EA;
      color: #111827;
      min-height: 100dvh;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #111827;
      color: #fff;
      padding: calc(18px + env(safe-area-inset-top)) 20px 16px;
    }
    .count {
      font-size: 64px;
      font-weight: 800;
      line-height: .95;
      letter-spacing: -2px;
    }
    .count span { font-size: 22px; font-weight: 600; letter-spacing: 0; margin-left: 6px; opacity: .7; }
    .sub { margin-top: 6px; font-size: 15px; color: #D1D5DB; }
    ul { list-style: none; margin: 12px 12px 0; padding: 0; }
    .row {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border-radius: 16px;
      padding: 16px 14px;
      margin-bottom: 8px;
      min-height: 64px;
      user-select: none;
    }
    .box {
      width: 28px;
      height: 28px;
      border: 2px solid #C4BBA8;
      border-radius: 8px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      font-size: 18px;
      color: #fff;
      background: #fff;
    }
    .row.on { background: #E7F6EC; }
    .row.on .box { background: #17803D; border-color: #17803D; }
    .name { font-size: 20px; font-weight: 700; flex: 1; }
    .n { color: #6B7280; font-size: 15px; font-weight: 600; }
    .add { display: flex; gap: 8px; margin: 14px 12px 0; }
    .add input {
      flex: 1;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font-size: 17px;
      min-height: 50px;
    }
    .add button {
      border: 0;
      background: #111827;
      color: #fff;
      border-radius: 14px;
      padding: 0 16px;
      font-weight: 700;
      font-size: 16px;
    }
    .note { text-align: center; color: #9CA3AF; font-size: 13px; margin-top: 16px; }
  </style>
</head>
<body>
  <header>
    <div class="count" id="num">0<span>žm.</span></div>
    <div class="sub" id="sub">Niekas dar nepažymėtas · jei visi — 28 žm.</div>
  </header>
  <ul id="list"></ul>
  <div class="add">
    <input id="newName" type="text" placeholder="Pridėti…" inputmode="text" />
    <button id="addBtn" type="button">+</button>
  </div>
  <p class="note">Bakstelėkite eilutę. Pora = 2, be poros = 1.</p>
  <script>
    const KEY = "sveciai-check-v1";
    const START = [
      ["Tautkai", 2], ["Nekrosiai", 2], ["Pozerskiai", 2], ["Sciupokai", 2],
      ["Tatarunai", 2], ["Pralataviciai", 2], ["Jokubauskai", 2], ["Stonkai", 2],
      ["Audrius Albris", 1], ["Pauliukas", 1], ["Petkeviciai", 2], ["Lenkai", 2],
      ["Ksystofai", 2], ["Paukščiai", 2], ["Budreviciai", 2]
    ];
    function load() {
      try {
        const s = JSON.parse(localStorage.getItem(KEY));
        if (s && s.length) return s;
      } catch (e) {}
      return START.map(([name, people]) => ({ name, people, on: false }));
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
    let data = load();
    const list = document.getElementById("list");
    function paint() {
      list.innerHTML = data.map((x, i) => `
        <li class="row${x.on ? " on" : ""}" data-i="${i}">
          <div class="box">${x.on ? "✓" : ""}</div>
          <div class="name">${x.name.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>
          <div class="n">${x.people}</div>
        </li>`).join("");
      const people = data.filter(x => x.on).reduce((s, x) => s + x.people, 0);
      const marked = data.filter(x => x.on).length;
      const max = data.reduce((s, x) => s + x.people, 0);
      document.getElementById("num").innerHTML = people + "<span>žm.</span>";
      document.getElementById("sub").textContent =
        (marked ? marked + " pažymėta" : "Niekas dar nepažymėtas") + " · jei visi — " + max + " žm.";
    }
    list.onclick = (e) => {
      const row = e.target.closest(".row");
      if (!row) return;
      const i = +row.dataset.i;
      data[i].on = !data[i].on;
      save();
      paint();
    };
    document.getElementById("addBtn").onclick = add;
    document.getElementById("newName").addEventListener("keydown", e => { if (e.key === "Enter") add(); });
    function add() {
      const el = document.getElementById("newName");
      const name = el.value.trim();
      if (!name) return;
      data.push({ name, people: 2, on: false });
      el.value = "";
      save();
      paint();
    }
    paint();
  </script>
</body>
</html>
